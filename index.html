<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapitein Keer — Tafels oefenen</title>

  <!-- Tailwind CSS via CDN (no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sky: '#87CEEB',    // achtergrond
            coral: '#FF6B6B',  // primaire accentkleur
            sand: '#FFE5B4',   // statistiektegels
            palm: '#2ECC71',   // succes
            sunset: '#F39C12', // waarschuwing
            ink: '#2C1810',    // randen en tekst
            white: '#FFFFFF'   // kaarten
          },
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Fredoka via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #87CEEB;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.30) 0%, transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(255, 229, 180, 0.40) 0%, transparent 40%);
    }
    /* Speech bubble met inkt-staart */
    .bubble {
      position: relative;
      background: #FFFFFF;
      border: 4px solid #2C1810;
      border-radius: 24px;
      box-shadow: 0 6px 0 rgba(44, 24, 16, 0.15);
    }
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 48px;
      border: 11px solid transparent;
      border-top-color: #2C1810;
    }
    /* Indruk-schaduweffect voor knoppen */
    .btn-press {
      box-shadow: 0 6px 0 rgba(44, 24, 16, 0.25);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn-press:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 rgba(44, 24, 16, 0.25);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-4 py-10">

  <main class="flex flex-col items-center gap-8 w-full max-w-lg">

    <!-- Speech bubble met app-titel -->
    <div class="bubble px-10 py-8 text-center w-full">
      <p class="text-sunset font-semibold text-lg tracking-wide">Tafelavontuur</p>
      <h1 class="text-5xl sm:text-6xl font-bold text-ink leading-tight">Kapitein Keer</h1>
      <p class="text-ink/70 font-medium text-xl mt-2">Klaar om je tafels te oefenen, kapitein?</p>
    </div>

    <!-- Statistiektegels -->
    <div class="flex gap-4">
      <div class="bg-sand border-4 border-ink rounded-2xl px-6 py-3 text-center shadow-[0_4px_0_rgba(44,24,16,0.15)]">
        <p class="text-3xl font-bold text-ink">10</p>
        <p class="text-sm font-semibold text-ink/70">Tafels</p>
      </div>
      <div class="bg-sand border-4 border-ink rounded-2xl px-6 py-3 text-center shadow-[0_4px_0_rgba(44,24,16,0.15)]">
        <p class="text-3xl font-bold text-ink" id="stat-mastered">0 / 100</p>
        <p class="text-sm font-semibold text-ink/70">Beheerst</p>
      </div>
      <div class="bg-sand border-4 border-ink rounded-2xl px-6 py-3 text-center shadow-[0_4px_0_rgba(44,24,16,0.15)]">
        <p class="text-3xl font-bold text-ink" id="stat-cards">100</p>
        <p class="text-sm font-semibold text-ink/70">Kaarten</p>
      </div>
    </div>

    <!-- Laadstatus (subtiel) -->
    <p id="load-status" class="text-sm font-semibold text-white drop-shadow">Kaarten laden…</p>

    <!-- Startknop (placeholder) -->
    <button type="button" class="btn-press bg-coral text-white text-3xl font-bold px-14 py-4 rounded-full border-4 border-ink">
      Start!
    </button>

    <!-- Pirate Cove-palet -->
    <div class="flex flex-wrap justify-center gap-4 mt-2" aria-label="Pirate Cove kleurenpalet">
      <div class="flex flex-col items-center gap-1">
        <span class="w-10 h-10 rounded-full border-4 border-ink bg-sky"></span>
        <span class="text-xs font-semibold text-white drop-shadow">Sky</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <span class="w-10 h-10 rounded-full border-4 border-ink bg-coral"></span>
        <span class="text-xs font-semibold text-white drop-shadow">Coral</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <span class="w-10 h-10 rounded-full border-4 border-ink bg-sand"></span>
        <span class="text-xs font-semibold text-white drop-shadow">Sand</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <span class="w-10 h-10 rounded-full border-4 border-ink bg-palm"></span>
        <span class="text-xs font-semibold text-white drop-shadow">Palm</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <span class="w-10 h-10 rounded-full border-4 border-ink bg-sunset"></span>
        <span class="text-xs font-semibold text-white drop-shadow">Sunset</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <span class="w-10 h-10 rounded-full border-4 border-ink bg-ink"></span>
        <span class="text-xs font-semibold text-white drop-shadow">Ink</span>
      </div>
    </div>

  </main>

  <!-- FSRS v6 pure functions (test seam, geladen door index.html en kapitein-keer.test.html) -->
  <script src="fsrs.js"></script>

  <!-- Kaartmodel + localStorage-persistentie (ticket 02) -->
  <script>
    (function () {
      'use strict';

      var FSRS = window.FSRS;

      var STORAGE_KEY = 'kapitein-keer:cards';
      var STREAK_KEY = 'kapitein-keer:streak';

      // Module-level state: alle 100 kaarten, geladen bij het opstarten van de pagina.
      var cards = [];

      // ── Kaartinitialisatie ──

      // Maakt de 100 kaart-objecten aan: tafels a=1..10, sommen b=1..10.
      // Een nieuwe kaart is nog nooit beoordeeld: geen FSRS-status, seen: false.
      function initCards() {
        var result = [];
        for (var a = 1; a <= 10; a++) {
          for (var b = 1; b <= 10; b++) {
            result.push({
              fact: { a: a, b: b },
              difficulty: null,
              stability: null,
              repetitions: 0,
              lapses: 0,
              nextReviewDate: null,
              previousReviewDate: null,
              seen: false
            });
          }
        }
        return result;
      }

      // ── Persistentie (kaarten) ──

      function saveCards(list) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      }

      // Leest de kaarten uit localStorage. Bij de eerste keer (of ongeldige data)
      // worden 100 nieuwe kaarten aangemaakt en meteen opgeslagen.
      function loadCards() {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              return parsed;
            }
          } catch (e) {
            // ongeldige JSON → opnieuw initialiseren
          }
        }
        var fresh = initCards();
        saveCards(fresh);
        return fresh;
      }

      // ── Persistentie (reeks / streak) ──

      function initStreak() {
        return { lastPracticeDate: null, streak: 0 };
      }

      function saveStreak(streak) {
        localStorage.setItem(STREAK_KEY, JSON.stringify(streak));
      }

      function loadStreak() {
        var raw = localStorage.getItem(STREAK_KEY);
        if (raw) {
          try {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') {
              return parsed;
            }
          } catch (e) {
            // ongeldige JSON → opnieuw initialiseren
          }
        }
        var fresh = initStreak();
        saveStreak(fresh);
        return fresh;
      }

      // ── Brugfuncties: app-kaart ↔ FSRS-kaart ──

      // App-kaart → FSRS-kaart (datums als Date-objecten, memoryModel per seen-flag).
      function appCardToFSRS(card) {
        return {
          memoryModel: card.seen
            ? FSRS.DSMemoryModel.create(card.difficulty, card.stability)
            : FSRS.NoMemoryModel.create(),
          repetitions: card.repetitions,
          lapses: card.lapses,
          nextReviewDate: card.nextReviewDate ? new Date(card.nextReviewDate) : null,
          previousReviewDate: card.previousReviewDate ? new Date(card.previousReviewDate) : null
        };
      }

      // FSRS-kaart (na schedule) → app-kaart (datums als ISO-strings, fact behouden).
      function fSRSMToAppCard(fsrsCard, fact) {
        return {
          fact: fact,
          difficulty: fsrsCard.memoryModel.stability !== undefined ? fsrsCard.memoryModel.difficulty : null,
          stability: fsrsCard.memoryModel.stability !== undefined ? fsrsCard.memoryModel.stability : null,
          repetitions: fsrsCard.repetitions,
          lapses: fsrsCard.lapses,
          nextReviewDate: fsrsCard.nextReviewDate ? fsrsCard.nextReviewDate.toISOString() : null,
          previousReviewDate: fsrsCard.previousReviewDate ? fsrsCard.previousReviewDate.toISOString() : null,
          seen: true
        };
      }

      // Beoordeelt een kaart met een grade en geeft de bijgewerkte app-kaart terug.
      // Wordt door latere tickets gebruikt na elke oefenbeurt.
      function applyGrade(card, grade) {
        var fsrsCard = appCardToFSRS(card);
        var scheduled = FSRS.schedule(fsrsCard, grade);
        return fSRSMToAppCard(scheduled, card.fact);
      }

      // ── Statistieken (startscherm) ──

      function refreshStats() {
        var mastered = cards.filter(function (c) { return c.seen; }).length;
        document.getElementById('stat-mastered').textContent = mastered + ' / 100';
        document.getElementById('stat-cards').textContent = String(cards.length);
        document.getElementById('load-status').textContent = cards.length + ' kaarten geladen';
      }

      // ── Init bij het laden van de pagina ──

      cards = loadCards();
      loadStreak();
      refreshStats();

      // Globale toegang voor latere tickets en tests.
      window.App = {
        get cards() { return cards; },
        loadCards: loadCards,
        saveCards: saveCards,
        initCards: initCards,
        appCardToFSRS: appCardToFSRS,
        fSRSMToAppCard: fSRSMToAppCard,
        applyGrade: applyGrade,
        loadStreak: loadStreak,
        saveStreak: saveStreak,
        STORAGE_KEY: STORAGE_KEY,
        STREAK_KEY: STREAK_KEY
      };
    })();
  </script>
</body>
</html>
